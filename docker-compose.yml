services:
  aleon-api:
    image: aleon-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=aleon_db;Username=postgres;Password=postgrespw
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=aleon_db
      - POSTGRES_PASSWORD=postgrespw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aleon_db"]
      interval: 5s
      timeout: 5s
      retries: 5
